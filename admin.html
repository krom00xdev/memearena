<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Sports Memes Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Login Box -->
  <div id="login-box" class="bg-zinc-900 border border-zinc-800 p-8 rounded-xl max-w-md w-full shadow-2xl">
    <h2 class="text-xl font-bold mb-4 text-emerald-400">Admin Authentication</h2>
    <p class="text-xs text-zinc-400 mb-6">Enter your administrator credentials to access the dashboard.</p>
    
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1">Username</label>
        <input type="text" id="login-username" placeholder="default: admin" class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1">Password</label>
        <input type="password" id="login-password" placeholder="default: admin123" class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      </div>
      <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-2.5 rounded text-sm transition mt-2">Login</button>
    </div>
  </div>

  <!-- Main Dashboard (Hidden until login) -->
  <div id="dashboard" class="bg-zinc-900 border border-zinc-800 p-8 rounded-xl max-w-2xl w-full shadow-2xl hidden my-8">
    
    <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
      <h2 class="text-xl font-bold text-emerald-400">Admin Control Center</h2>
      <div class="flex gap-2">
        <button onclick="switchTab('upload')" id="tab-upload" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded transition font-medium">Upload Media</button>
        <button onclick="switchTab('settings')" id="tab-settings" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded transition font-medium">Account Settings ⚙️</button>
        <a href="index.html" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded transition font-medium">View Site ➔</a>
      </div>
    </div>

    <!-- TAB 1: FILE UPLOAD FORM -->
    <div id="section-upload">
      <form id="upload-form" onsubmit="uploadMeme(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Meme Title / Caption</label>
          <input type="text" id="title" required placeholder="e.g. Unbelievable last minute goal!" class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Select Media File (Image, GIF, or .mp4 Video)</label>
          <input type="file" id="media_file" accept="image/*,video/mp4,image/gif" required class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-300 file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Sport</label>
            <select id="sport" onchange="updateCompetitions()" class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
              <option value="football">Football ⚽</option>
              <option value="basketball">Basketball 🏀</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Competition / League</label>
            <select id="competition" class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
              <!-- Populated dynamically -->
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 rounded text-sm transition mt-6">Upload & Publish Meme 🚀</button>
        <p id="status-msg" class="text-center text-xs mt-3 font-medium"></p>
      </form>
    </div>

    <!-- TAB 2: ACCOUNT SETTINGS FORM -->
    <div id="section-settings" class="hidden space-y-4">
      <h3 class="text-sm font-bold text-zinc-300 uppercase tracking-wider mb-2">Change Admin Credentials</h3>
      
      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1">New Username</label>
        <input type="text" id="new-username" placeholder="Enter new username" class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1">New Password</label>
        <input type="password" id="new-password" placeholder="Enter new password" class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <button onclick="saveAccountSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 rounded text-sm transition mt-4">Save Account Settings 💾</button>
      <p id="settings-msg" class="text-center text-xs mt-3 font-medium"></p>
    </div>

  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ayfkiofamrnnsmerfcpf.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_67CCvUlVyJCJukihrXheHg_CNCiP5VM';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const leagues = {
      football: ['Champions League', 'Europa League', 'Conference League', 'National Teams', 'Premier League', 'La Liga', 'Serie A', 'Bundesliga', 'Ligue 1', 'Eredivisie', 'Primeira Liga', 'Belgian Pro League', 'Greek Super League'],
      basketball: ['NBA', 'EuroLeague', 'National Teams']
    };

    function getCredentials() {
      return {
        user: localStorage.getItem('admin_user') || 'admin',
        pass: localStorage.getItem('admin_pass') || 'admin123'
      };
    }

    function login() {
      const uInput = document.getElementById('login-username').value.trim();
      const pInput = document.getElementById('login-password').value.trim();
      const creds = getCredentials();

      if (uInput === creds.user && pInput === creds.pass) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        updateCompetitions();
      } else {
        alert('Invalid Username or Password!');
      }
    }

    function switchTab(tab) {
      if (tab === 'upload') {
        document.getElementById('section-upload').classList.remove('hidden');
        document.getElementById('section-settings').classList.add('hidden');
        document.getElementById('tab-upload').className = "text-xs bg-emerald-600 text-white px-3 py-1.5 rounded transition font-medium";
        document.getElementById('tab-settings').className = "text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded transition font-medium";
      } else {
        document.getElementById('section-upload').classList.add('hidden');
        document.getElementById('section-settings').classList.remove('hidden');
        document.getElementById('tab-upload').className = "text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded transition font-medium";
        document.getElementById('tab-settings').className = "text-xs bg-emerald-600 text-white px-3 py-1.5 rounded transition font-medium";
        
        const creds = getCredentials();
        document.getElementById('new-username').value = creds.user;
      }
    }

    function saveAccountSettings() {
      const newU = document.getElementById('new-username').value.trim();
      const newP = document.getElementById('new-password').value.trim();
      const msg = document.getElementById('settings-msg');

      if (!newU || !newP) {
        msg.className = "text-center text-xs mt-3 font-medium text-red-400";
        msg.innerText = "Username and password cannot be empty!";
        return;
      }

      localStorage.setItem('admin_user', newU);
      localStorage.setItem('admin_pass', newP);

      msg.className = "text-center text-xs mt-3 font-medium text-emerald-400";
      msg.innerText = "Account settings saved successfully!";
    }

    function updateCompetitions() {
      const sport = document.getElementById('sport').value;
      const compSelect = document.getElementById('competition');
      compSelect.innerHTML = leagues[sport].map(l => `<option value="${l}">${l}</option>`).join('');
    }

    async function uploadMeme(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('status-msg');
      const fileInput = document.getElementById('media_file');
      
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please select a file to upload.");
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.innerText = 'Uploading file...';
      msg.innerText = '';

      try {
        let mediaType = 'image';
        if (file.type.includes('gif')) {
          mediaType = 'gif';
        } else if (file.type.includes('video') || file.name.endsWith('.mp4')) {
          mediaType = 'video';
        }

        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        const filePath = `uploads/${fileName}`;

        const { error: storageError } = await supabaseClient.storage
          .from('memes')
          .upload(filePath, file, { cacheControl: '3600', upsert: false });

        if (storageError) throw storageError;

        const { data: publicUrlData } = supabaseClient.storage
          .from('memes')
          .getPublicUrl(filePath);

        const payload = {
          title: document.getElementById('title').value,
          media_url: publicUrlData.publicUrl,
          type: mediaType,
          sport: document.getElementById('sport').value,
          competition: document.getElementById('competition').value,
          source: 'Direct Upload',
          created_at: new Date().toISOString()
        };

        const { error: dbError } = await supabaseClient.from('posts').insert([payload]);
        if (dbError) throw dbError;

        msg.className = 'text-center text-xs mt-3 font-medium text-emerald-400';
        msg.innerText = 'Success! File uploaded and published.';
        document.getElementById('upload-form').reset();
        updateCompetitions();

      } catch (err) {
        msg.className = 'text-center text-xs mt-3 font-medium text-red-400';
        msg.innerText = `Upload Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Upload & Publish Meme 🚀';
      }
    }
  </script>
</body>
</html>
